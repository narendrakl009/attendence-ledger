<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Attendance Ledger</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />
<meta name="theme-color" content="#2B2620" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --paper: #F1ECDF;
    --card: rgba(255,255,255,0.72);
    --ink: #2B2620;
    --ink-muted: #8A7F68;
    --line: #E2DAC3;
    --line-strong: #C8BFA8;
    --green: #3B6E50;
    --red: #A8412F;
    --cell-empty: #EFE8D6;
    --future: #CFC6AD;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .ledger-font { font-family: 'Courier Prime', monospace; }

  .wrap { max-width: 420px; margin: 0 auto; padding: 24px 16px 40px; }

  .eyebrow { font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-muted); margin: 0; }
  h1 { font-size: 24px; font-weight: 700; margin: 4px 0 20px; }

  #banner { display: none; font-size: 12px; color: var(--red); background: rgba(168,65,46,0.08); border: 1px solid var(--red); border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
  .tab { white-space: nowrap; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; border: 1px solid var(--line-strong); background: transparent; color: var(--ink-muted); cursor: pointer; }
  .tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .tab-add { white-space: nowrap; padding: 6px 12px; border-radius: 999px; font-size: 14px; border: 1px dashed var(--line-strong); background: transparent; color: var(--ink-muted); cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .tab-add-input { display: flex; gap: 4px; align-items: center; }
  .tab-add-input input { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: rgba(255,255,255,0.6); width: 120px; font-size: 14px; font-family: inherit; }
  .tab-add-input button { width: 30px; height: 30px; border-radius: 999px; border: none; background: var(--ink); color: var(--paper); cursor: pointer; }

  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; }
  .stat .val { font-family: 'Courier Prime', monospace; font-size: 20px; font-weight: 700; }
  .stat .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); margin-top: 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head button { background: none; border: none; padding: 6px; border-radius: 999px; cursor: pointer; color: var(--ink); }
  .cal-head button:hover { background: var(--line); }
  .cal-title { font-family: 'Courier Prime', monospace; font-weight: 700; }

  .dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: var(--ink-muted); margin-bottom: 6px; font-family: 'Courier Prime', monospace; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { position: relative; aspect-ratio: 1 / 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: 'Courier Prime', monospace; background: var(--cell-empty); border: none; cursor: pointer; color: var(--ink); }
  .day.future { color: var(--future); cursor: default; background: transparent; }
  .day.today { box-shadow: 0 0 0 2px var(--red); }
  .day.blank { background: transparent; cursor: default; }
  .day .stamp { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 2px solid; font-weight: 700; animation: stampIn 150ms ease-out; }
  .day .stamp.visited { border-color: var(--green); color: var(--green); transform: rotate(-6deg); }
  .day .stamp.missed { border-color: var(--red); color: var(--red); transform: rotate(4deg); }
  @keyframes stampIn { from { transform: scale(1.5) rotate(var(--r,0deg)); opacity:0; } to { transform: scale(1) rotate(var(--r,0deg)); opacity:1; } }

  .legend { display: flex; gap: 14px; margin-top: 14px; font-size: 12px; color: var(--ink-muted); flex-wrap: wrap; }
  .legend span.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 2px solid; margin-right: 4px; vertical-align: -1px; }

  .remove-link { margin-top: 14px; font-size: 12px; color: var(--ink-muted); background: none; border: none; cursor: pointer; padding: 0; }
  .remove-link:hover { color: var(--red); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow ledger-font">Attendance Ledger</p>
    <h1 class="ledger-font">Show up, don't skip.</h1>
    <div id="banner"></div>
    <div class="tabs" id="tabs"></div>
    <div class="stats" id="stats"></div>
    <div class="card">
      <div class="cal-head">
        <button id="prevMonth" aria-label="Previous month">&#8592;</button>
        <span class="cal-title" id="calTitle"></span>
        <button id="nextMonth" aria-label="Next month">&#8594;</button>
      </div>
      <div class="dow">
        <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
      </div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="legend">
      <span><span class="swatch" style="border-color:#3B6E50"></span>Visited</span>
      <span><span class="swatch" style="border-color:#A8412F"></span>Missed</span>
      <span>Tap a day to cycle</span>
    </div>
    <button id="removeBtn" class="remove-link" style="display:none;"></button>
  </div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "habit-tracker-v1";
  var DEFAULT_DATA = {
    activities: [
      { id: "a1", name: "AI Prompting Course" },
      { id: "a2", name: "Web Architecture & Scraping" }
    ],
    logs: {}
  };

  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  // ---- storage with safe fallback ----
  var storageOK = true;
  var memoryFallback = null;

  function testStorage() {
    try {
      var t = "__t__" + Date.now();
      localStorage.setItem(t, "1");
      localStorage.removeItem(t);
      return true;
    } catch (e) {
      return false;
    }
  }
  storageOK = testStorage();

  function loadData() {
    if (storageOK) {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { storageOK = false; }
    }
    if (memoryFallback) return memoryFallback;
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }

  function saveData(data) {
    if (storageOK) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return;
      } catch (e) { storageOK = false; }
    }
    memoryFallback = data;
    showBanner();
  }

  function showBanner() {
    var b = document.getElementById("banner");
    b.style.display = "block";
    b.textContent = "Storage is blocked in this preview, so changes won't be saved. Download this file and open it directly in your phone's browser for it to save permanently.";
  }

  if (!storageOK) showBanner();

  // ---- date helpers ----
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function toKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function startOfDay(d) { var x = new Date(d); x.setHours(0,0,0,0); return x; }
  function sameDay(a, b) { return toKey(a) === toKey(b); }

  // ---- state ----
  var data = loadData();
  var activeId = data.activities.length ? data.activities[0].id : null;
  var viewDate = startOfDay(new Date());
  var today = startOfDay(new Date());
  var addingActivity = false;

  function persist() { saveData(data); }

  // ---- rendering ----
  function render() {
    renderTabs();
    renderStats();
    renderCalendar();
    renderRemove();
  }

  function renderTabs() {
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    data.activities.forEach(function (a) {
      var btn = document.createElement("button");
      btn.className = "tab" + (a.id === activeId ? " active" : "");
      btn.textContent = a.name;
      btn.onclick = function () { activeId = a.id; render(); };
      tabs.appendChild(btn);
    });

    if (addingActivity) {
      var wrap = document.createElement("div");
      wrap.className = "tab-add-input";
      var input = document.createElement("input");
      input.placeholder = "New course…";
      input.autofocus = true;
      input.onkeydown = function (e) {
        if (e.key === "Enter") confirmAdd(input.value);
        if (e.key === "Escape") { addingActivity = false; render(); }
      };
      var btn = document.createElement("button");
      btn.textContent = "+";
      btn.onclick = function () { confirmAdd(input.value); };
      wrap.appendChild(input);
      wrap.appendChild(btn);
      tabs.appendChild(wrap);
      setTimeout(function () { input.focus(); }, 0);
    } else {
      var add = document.createElement("button");
      add.className = "tab-add";
      add.textContent = "+ Add";
      add.onclick = function () { addingActivity = true; render(); };
      tabs.appendChild(add);
    }
  }

  function confirmAdd(name) {
    name = (name || "").trim();
    if (!name) { addingActivity = false; render(); return; }
    var id = "a" + Date.now();
    data.activities.push({ id: id, name: name });
    activeId = id;
    addingActivity = false;
    persist();
    render();
  }

  function getLogs() { return data.logs[activeId] || {}; }

  function cycleStatus(dateObj) {
    if (dateObj > today) return;
    var key = toKey(dateObj);
    var logs = data.logs[activeId] || {};
    var current = logs[key];
    var next;
    if (!current) next = "visited";
    else if (current === "visited") next = "missed";
    else next = undefined;
    if (next) logs[key] = next; else delete logs[key];
    data.logs[activeId] = logs;
    persist();
    render();
  }

  function computeStats() {
    var logs = getLogs();
    var dates = Object.keys(logs).sort();
    var longest = 0, run = 0, prevDate = null;
    dates.forEach(function (dStr) {
      if (logs[dStr] !== "visited") { run = 0; prevDate = null; return; }
      var d = new Date(dStr + "T00:00:00");
      if (prevDate) {
        var diff = Math.round((d - prevDate) / 86400000);
        run = diff === 1 ? run + 1 : 1;
      } else run = 1;
      longest = Math.max(longest, run);
      prevDate = d;
    });

    var current = 0, cursor = new Date(today), firstCheck = true;
    while (true) {
      var key = toKey(cursor);
      var status = logs[key];
      if (status === "visited") current += 1;
      else if (!status && firstCheck) { /* grace for today */ }
      else break;
      firstCheck = false;
      cursor.setDate(cursor.getDate() - 1);
    }

    var visited = dates.filter(function (d) { return logs[d] === "visited"; }).length;
    var missed = dates.filter(function (d) { return logs[d] === "missed"; }).length;
    var total = visited + missed;
    var rate = total ? Math.round((visited / total) * 100) : 0;
    return { current: current, longest: longest, rate: rate };
  }

  function renderStats() {
    var stats = computeStats();
    var el = document.getElementById("stats");
    el.innerHTML =
      statHTML("🔥 " + stats.current, "Streak") +
      statHTML(stats.longest, "Best") +
      statHTML(stats.rate + "%", "Show-up rate");
  }
  function statHTML(val, lbl) {
    return '<div class="stat"><div class="val">' + val + '</div><div class="lbl">' + lbl + '</div></div>';
  }

  function renderCalendar() {
    var year = viewDate.getFullYear(), month = viewDate.getMonth();
    document.getElementById("calTitle").textContent = MONTH_NAMES[month] + " " + year;

    var first = new Date(year, month, 1);
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var offset = first.getDay();
    var logs = getLogs();
    var grid = document.getElementById("grid");
    grid.innerHTML = "";

    for (var i = 0; i < offset; i++) {
      var blank = document.createElement("div");
      blank.className = "day blank";
      grid.appendChild(blank);
    }

    for (var d = 1; d <= daysInMonth; d++) {
      var date = new Date(year, month, d);
      var key = toKey(date);
      var status = logs[key];
      var future = date > today;
      var cell = document.createElement("button");
      cell.className = "day" + (future ? " future" : "") + (sameDay(date, today) ? " today" : "");
      if (!status) cell.textContent = d;
      if (status === "visited") {
        cell.innerHTML = '<span class="stamp visited">&#10003;</span>';
      } else if (status === "missed") {
        cell.innerHTML = '<span class="stamp missed">&#10007;</span>';
      }
      if (!future) cell.onclick = (function (dt) { return function () { cycleStatus(dt); }; })(date);
      else cell.disabled = true;
      grid.appendChild(cell);
    }
  }

  function renderRemove() {
    var btn = document.getElementById("removeBtn");
    if (data.activities.length > 1) {
      var active = data.activities.find(function (a) { return a.id === activeId; });
      btn.style.display = "inline-block";
      btn.textContent = "🗑 Remove “" + (active ? active.name : "") + "”";
      btn.onclick = function () {
        if (!confirm('Remove "' + active.name + '" and its history?')) return;
        data.activities = data.activities.filter(function (a) { return a.id !== activeId; });
        delete data.logs[activeId];
        activeId = data.activities.length ? data.activities[0].id : null;
        persist();
        render();
      };
    } else {
      btn.style.display = "none";
    }
  }

  document.getElementById("prevMonth").onclick = function () {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
    renderCalendar();
  };
  document.getElementById("nextMonth").onclick = function () {
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
    renderCalendar();
  };

  render();

  // register service worker only on a real https/localhost origin
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  }
})();
</script>
</body>
</html>
